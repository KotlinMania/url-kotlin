name: CodeQL (Java/Kotlin)

# Production KMP JVM compilation extraction.
# Runs compileKotlinJvm directly against commonMain + jvmMain to extract
# the production JVM artifact into CodeQL without a separate build.

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Java/Kotlin extraction target
        run: |
          ./gradlew --no-daemon compileKotlinJvm -Pkotlinmania.codeql=true --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:java-kotlin"
